syntax = "proto3";

package splatstream;

message Hello {
    uint32 version = 1;
    // true: server renders and streams video. false: server sends the scene
    bool video = 2;
}

message Welcome {
    uint32 client_id = 1;
    uint32 udp_port = 2;
}

message Ping {
    uint64 id = 1;
    uint64 client_time_us = 2;
}

message Pong {
    uint64 id = 1;
    uint64 client_time_us = 2;
}

message SceneInfo {
    uint64 gaussian_count = 1;
    uint32 sh_degree = 2;
    uint32 gaussians_per_chunk = 3;
    uint32 chunk_count = 4;
}

// data is zstd compressed. uncompressed it holds the chunk's slice of every
// array in GaussianScene, one after another (positions, scales, rotations,
// opacities, shDC, shRest)
message SceneChunk {
    uint32 index = 1;
    uint32 raw_size = 2;
    bytes data = 3;
}

// one h264 frame. camera_* tell the client which camera update was rendered,
// so it can measure input to display latency with its own clock
message VideoFrame {
    uint32 frame_id = 1;
    uint32 camera_sequence = 2;
    uint64 camera_time_us = 3;
    uint32 render_us = 4;
    uint32 encode_us = 5;
    bytes data = 6;
}

// everything sent over tcp is wrapped in this
message Message {
    oneof payload {
        Hello hello = 1;
        Welcome welcome = 2;
        Ping ping = 3;
        Pong pong = 4;
        SceneInfo scene_info = 5;
        SceneChunk scene_chunk = 6;
        VideoFrame video_frame = 7;
    }
}

// sent alone over udp, one per datagram
message CameraUpdate {
    uint32 client_id = 1;
    uint32 sequence = 2;
    float x = 3;
    float y = 4;
    float z = 5;
    float qw = 6;
    float qx = 7;
    float qy = 8;
    float qz = 9;
    uint64 client_time_us = 10;
}
